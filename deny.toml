# cargo-deny 配置 —— 许可证 / 依赖禁用 / 来源校验
#
# 与 .cargo/audit.toml 的分工：
# - cargo-audit → RUSTSEC 漏洞库（含 yanked / unsound 告警），豁免原因记录在 .cargo/audit.toml
# - cargo-deny  → 许可证白名单、依赖形态（bans）、registry 来源
#
# 因此这里**不**重复配置 advisories，避免同一问题两处维护。
#
# 用法：cargo deny --all-features check licenses bans sources

[graph]
all-features = true
# 只校验本平台会真正编译的依赖，避免把仅在其他目标平台使用的
# crate（如 Windows-only 的 windows-* 传递依赖）纳入许可证判断。
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
# 本项目以 GPL-3.0 发布，依赖需与之兼容。
#
# 多许可证（`A OR B`）的 crate 只要能选出其中一个白名单内的许可证即通过。
# 实际被选中的分支：
#   ittapi / ittapi-sys : GPL-2.0-only OR BSD-3-Clause   → BSD-3-Clause
#   ryu                 : Apache-2.0 OR BSL-1.0          → Apache-2.0
#   r-efi               : MIT OR Apache-2.0 OR LGPL-2.1+ → MIT
#   aho-corasick 等     : Unlicense OR MIT               → MIT
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    # 本项目自身的许可证（SPDX 精确写法，见 LICENSE）
    "GPL-3.0-only",
]
# wreq-util 2.2.6 使用已弃用的 `GPL-3.0` 标识，无法在本仓库修正；
# 它实际就是 GPL-3.0-only，通过下面的 clarify 显式声明，避免误判为未授权。
confidence-threshold = 0.8
# 允许白名单里保留当前依赖图尚未用到的许可证：白名单是「允许集合」而非
# 「已用集合」，依赖升级/新增时不应因为提前预留而报警。
unused-allowed-license = "allow"

[[licenses.clarify]]
name = "wreq-util"
expression = "GPL-3.0-only"
license-files = []

[bans]
# 同一 crate 的多个版本在依赖树中很常见（wasmtime 树尤其明显），
# 强制统一会与上游升级冲突，因此不禁止。
multiple-versions = "allow"
# 依赖必须固定版本：通配符（含不带 version 的 path 依赖）会让构建不可复现。
wildcards = "deny"
deny = [
    # 统一走 BoringSSL（wreq）；同时引入 openssl / native-tls 会带来
    # 第二套 TLS 实现与额外的系统依赖
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
# 依赖只能来自 crates.io，保证可复现且可审计
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
